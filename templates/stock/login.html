{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radhu Industries - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* FULL-SCREEN BACKGROUND - Darker & Premium */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #0a0e1a;
            z-index: 9999;
        }

        /* Animated gradient background */
        .bg-gradient-animate {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(139, 92, 246, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(236, 72, 153, 0.08) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* Animated gradient orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            animation: orbFloat 12s ease-in-out infinite alternate;
            pointer-events: none;
            opacity: 0.6;
        }
        .orb-1 {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(59,130,246,0.25), transparent);
            top: -25%;
            left: -15%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139,92,246,0.2), transparent);
            bottom: -25%;
            right: -15%;
            animation-delay: 3s;
        }
        .orb-3 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(236,72,153,0.15), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 6s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.2); }
            66% { transform: translate(-40px, 50px) scale(0.9); }
            100% { transform: translate(30px, -30px) scale(1.1); }
        }

        /* Glass card - Premium */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 50px 42px;
            margin: 20px;
        }
        .glass-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 
                0 50px 100px -20px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Premium border glow */
        .glass-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 32px;
            background: linear-gradient(135deg, 
                rgba(59,130,246,0.3), 
                rgba(139,92,246,0.3), 
                rgba(236,72,153,0.2), 
                rgba(59,130,246,0.1));
            z-index: -1;
            opacity: 0.4;
            animation: borderGlow 6s ease-in-out infinite alternate;
            background-size: 300% 300%;
            filter: blur(2px);
        }
        @keyframes borderGlow {
            0% { opacity: 0.3; background-position: 0% 50%; }
            50% { opacity: 0.7; background-position: 100% 50%; }
            100% { opacity: 0.3; background-position: 0% 50%; }
        }

        /* LOGO */
        .logo-container {
            width: 190px;
            height: 105px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px;
        }
        .logo-container:hover {
            border-color: rgba(59,130,246,0.3);
            background: rgba(255, 255, 255, 0.07);
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(59,130,246,0.05);
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        /* Title with premium glow */
        .title-glow {
            text-shadow: 0 0 40px rgba(59,130,246,0.1);
            letter-spacing: 0.5px;
            font-weight: 700;
        }
        .sub-title {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
            letter-spacing: 3px;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            animation: particleFloat linear infinite;
            box-shadow: 0 0 10px rgba(59,130,246,0.1);
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(720deg) scale(1); opacity: 0; }
        }

        /* Premium Input Fields */
        .login-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 17px 20px 17px 52px;
            color: #fff;
            width: 100%;
            transition: all 0.4s ease;
            font-size: 15px;
            outline: none;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .login-input:focus {
            border-color: rgba(59,130,246,0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(59,130,246,0.05), inset 0 0 30px rgba(59,130,246,0.02);
            transform: scale(1.01);
        }
        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 0.5px;
        }
        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
            font-size: 17px;
        }
        .input-group:focus-within .input-icon {
            color: rgba(59,130,246,0.6);
            transform: translateY(-50%) scale(1.15);
        }

        /* Premium Login Button */
        .login-btn {
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
            background-size: 300% 300%;
            border: none;
            border-radius: 18px;
            padding: 19px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(59,130,246,0.25);
            animation: gradientMove 5s ease-in-out infinite;
            letter-spacing: 0.5px;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 50px rgba(59,130,246,0.35);
        }
        .login-btn:active {
            transform: scale(0.97);
        }
        .login-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: btnShine 5s ease-in-out infinite;
        }
        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Pulse ring on button */
        .login-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
            z-index: -1;
            opacity: 0;
            animation: pulseRing 3s ease-in-out infinite;
            filter: blur(15px);
        }
        @keyframes pulseRing {
            0%, 100% { opacity: 0; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.06); }
        }

        /* Error message - Premium */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 15px 20px;
            color: #fca5a5;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(10px);
            animation: errorShake 0.6s ease;
        }
        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .error-box i {
            font-size: 18px;
            color: #f87171;
        }

        /* Auth badge - Premium */
        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.1);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 10px;
            color: rgba(252, 165, 165, 0.7);
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-top: 28px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .auth-badge:hover {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.2);
        }
        .auth-badge i {
            font-size: 14px;
            animation: shieldPulse 2.5s ease-in-out infinite;
            color: rgba(252, 165, 165, 0.8);
        }
        @keyframes shieldPulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .glass-card {
                padding: 35px 24px;
                margin: 16px;
                max-width: 100%;
                border-radius: 24px;
            }
            .logo-container {
                width: 140px;
                height: 70px;
            }
            .orb-1 { width: 350px; height: 350px; }
            .orb-2 { width: 300px; height: 300px; }
            .orb-3 { width: 250px; height: 250px; }
            .login-input {
                padding: 15px 16px 15px 46px;
                font-size: 14px;
            }
            .login-btn {
                padding: 16px;
                font-size: 15px;
            }
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

<!-- Animated Background -->
<div class="bg-gradient-animate"></div>

<!-- Particle container -->
<div id="particles-container" style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;"></div>

<div class="login-container">
    <!-- Animated Gradient Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- Premium Login Card -->
    <div class="glass-card">
        <!-- Logo -->
        <div class="logo-container">
            <img style="border-radius: 0.5rem;" src="{% static 'icon/radhulogo.png' %}" alt="Radhu Industries">
        </div>

        <h1 class="text-2xl font-bold text-center text-white mb-1 tracking-tight title-glow">Radhu Industries</h1>
        <p class="text-center sub-title mb-8">Stock Management</p>

        {% if form.errors %}
        <div class="error-box mb-6">
            <i class="fas fa-shield-alt"></i>
            <span>Invalid credentials. Only authorized officials allowed.</span>
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div class="input-group relative">
                <i class="fas fa-user input-icon"></i>
                <input type="text" name="username" required autofocus
                    class="login-input"
                    placeholder="Official Username">
            </div>
            <div class="input-group relative">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password" required
                    class="login-input"
                    placeholder="••••••••">
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt mr-2"></i> Authorized Login
            </button>
        </form>

        <div class="auth-badge">
            <i class="fas fa-shield-alt"></i> ONLY FOR AUTHORIZED OFFICIALS
        </div>
    </div>
</div>

<script>
// Premium floating particles
(function() {
    const container = document.getElementById('particles-container');
    const count = 70;
    for (let i = 0; i < count; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 6 + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = (Math.random() * 25 + 15) + 's';
        particle.style.animationDelay = (Math.random() * 25) + 's';
        particle.style.opacity = Math.random() * 0.5 + 0.2;
        container.appendChild(particle);
    }
})();

// Subtle parallax on mouse move
document.addEventListener('mousemove', function(e) {
    const orbs = document.querySelectorAll('.orb');
    const x = e.clientX / window.innerWidth;
    const y = e.clientY / window.innerHeight;
    orbs.forEach((orb, index) => {
        const speed = 10 + index * 5;
        const moveX = (x - 0.5) * speed;
        const moveY = (y - 0.5) * speed;
        orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });
});
</script>
</body>
</html>
