{% extends 'hrms/base.html' %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-8">

    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
        <h2 class="text-xl font-bold text-slate-800">
            <i class="fa-solid fa-building text-indigo-600 mr-2"></i> {{ title }}
        </h2>
        <a href="{% url 'department_list' %}" class="text-slate-600 hover:text-slate-800 text-sm font-medium">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <form method="post" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Department Name <span class="text-red-500">*</span></label>
            {{ form.name }}
            {% if form.name.errors %}<p class="text-red-500 text-xs mt-1">{{ form.name.errors.0 }}</p>{% endif %}
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
            <a href="{% url 'department_list' %}" class="px-6 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 font-medium text-sm">Cancel</a>
            <button type="submit" class="px-8 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm shadow">Save Department</button>
        </div>
    </form>

</div>
{% endblock %}
