{% extends "hrms/base.html" %}

{% block title %}Generate Salary{% endblock %}
{% block page_title %}Generate Salary{% endblock %}

{% block content %}

<div class="bg-white rounded-xl shadow p-8">

<form method="post">

{% csrf_token %}

<div class="grid md:grid-cols-3 gap-5">

<div>

<label class="font-semibold block mb-2">

Employee

</label>

<select name="employee" class="w-full border rounded p-2">

{% for emp in employees %}

<option value="{{ emp.id }}">

{{ emp.employee_code }} - {{ emp.name }}

</option>

{% endfor %}

</select>

</div>

<div>

<label class="font-semibold block mb-2">

Month

</label>

<select name="month" class="w-full border rounded p-2">

<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6">June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>

</select>

</div>

<div>

<label class="font-semibold block mb-2">

Year

</label>

<input type="number"
name="year"
value="2026"
class="w-full border rounded p-2">

</div>

</div>

<div class="mt-8">

<button class="bg-blue-700 text-white px-8 py-3 rounded">

Generate Salary

</button>

</div>

</form>

</div>

{% endblock %}
